# MinIO object storage — use with: docker compose -f docker-compose.yml -f docker-compose.storage.yml up -d
services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: stemverse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stemverse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stemverse_minio_dev}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stemverse-net

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    container_name: stemverse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/scratch-assets;
      mc mb --ignore-existing local/project-assets;
      mc mb --ignore-existing local/marketplace-assets;
      mc mb --ignore-existing local/ai-assets;
      mc anonymous set none local/scratch-assets;
      mc anonymous set none local/project-assets;
      mc anonymous set none local/marketplace-assets;
      mc anonymous set none local/ai-assets;
      echo 'Buckets ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stemverse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stemverse_minio_dev}
    networks:
      - stemverse-net

volumes:
  minio_data:

networks:
  stemverse-net:
    name: stemverse-net
