<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechyGuide Block Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="mode-scratch">
    <!-- ── Header (populated by ModeSwitcher.js) ───── -->
    <header id="appHeader"
      class="flex items-center justify-between h-16 pr-4 pl-0 sticky top-0 z-50 bg-blue-400 text-gray-900 shadow-[0_2px_8px_rgba(0,0,0,0.12)]">
    </header>

    <!-- ── Main Layout ────────────────────────────── -->
    <div id="pageContainer">
      <!-- Blockly workspace (always visible) -->
      <div id="blocklyDiv"></div>
      
      <!-- Pane Toggle Button -->
      <button id="togglePaneBtn" class="pane-toggle-btn" title="Toggle Sidebar">
        <i data-lucide="chevron-right" style="width:20px;height:20px;"></i>
      </button>

      <!-- RIGHT PANE: Scratch mode (default) -->
      <div id="scratchPane" class="right-pane">
        <div id="stageContainer">
          <div id="scratchControls" class="scratch-controls">
            <button id="greenFlagBtn" class="control-btn flag-btn" title="Start">
              <i data-lucide="play" color="#4CAF50" stroke-width="2.5" style="width: 20px; height: 20px;"></i>
            </button>
            <button id="stopBtn" class="control-btn stop-btn" title="Stop">
              <i data-lucide="square" color="#d35400" stroke-width="2.5" fill="#d35400" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
          <div id="stageCanvas" style="width:480px;height:360px;overflow:hidden;"></div>
        </div>
        <div id="spritePanelContainer"></div>
      </div>

      <!-- RIGHT PANE: Board mode (hidden by default) -->
      <div id="boardPane" class="right-pane" style="display: none;">

        <!-- ── Board Stage Sub-view (toggled from header pills) ── -->
        <div id="boardStageView" class="board-subview" style="display:none;">
          <div id="boardStageSlot"></div>
        </div>

        <!-- ── Board Code Sub-view ── -->
        <div id="boardCodeView" class="board-subview">

          <div class="editor-header">
            <div class="file-tab" id="codeFileTab">
              <i data-lucide="file-code-2" style="width: 16px; height: 16px;"></i>
              <span id="codeFileName">sketch.ino</span>
            </div>
            <select class="env-dropdown" id="envDropdown">
              <option value="arduino">C++ (Arduino)</option>
              <option value="micropython">MicroPython</option>
            </select>
          </div>



          <!-- Code Editor Body: gutter + editable textarea -->
          <div class="code-editor-body" id="codeEditorBody">
            <div class="code-gutter" id="codeGutter"></div>
            <textarea
              class="code-content code-textarea"
              id="codeContent"
              spellcheck="false"
              autocorrect="off"
              autocapitalize="off"
              data-gramm="false"
            ></textarea>
          </div>

          <!-- Progress Bar -->
          <div id="uploadProgressWrapper" style="display: none; border-top: 1px solid var(--border); background-color: var(--code-bg); padding: 8px 12px; flex-shrink: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px;">
              <span id="uploadProgressLabel" style="color: var(--text-secondary); font-weight: 500;">Compiling...</span>
              <span id="uploadProgressPercent" style="color: var(--text-secondary); font-weight: 600;">0%</span>
            </div>
            <div style="width: 100%; height: 6px; background-color: var(--border); border-radius: 3px; overflow: hidden; position: relative;">
              <div id="uploadProgressBar" class="progress-bar-animated" style="width: 0%; height: 100%; border-radius: 3px; transition: width 0.2s ease;"></div>
            </div>
          </div>

          <div class="editor-footer">
            <button class="toolbar-btn" id="downloadCodeBtn">
              <i data-lucide="download" style="width: 16px; height: 16px;"></i>
              <span id="downloadBtnLabel">Download .ino</span>
            </button>
            <button class="toolbar-btn" id="uploadBtn">
              <i data-lucide="upload" style="width: 16px; height: 16px;"></i>
              <span id="uploadBtnLabel">Upload Code</span>
            </button>
            <span id="uploadStatus" style="font-size: 11px; margin-left: auto; color: var(--text-muted); display: none;"></span>
          </div>

          <!-- ── Serial Monitor ── -->
          <div id="serialMonitorContainer"></div>

        </div><!-- /boardCodeView -->
      </div><!-- /boardPane -->
    </div>

    <!-- Hidden legacy elements (kept for compatibility) -->
    <pre id="generatedCode" style="display:none;"><code></code></pre>
  </body>
</html>
